name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: salah-os-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to the apk branch
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/salah-os.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk
          git rm -rf . -q
          cp /tmp/out/salah-os.apk .
          git add salah-os.apk
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f origin apk
