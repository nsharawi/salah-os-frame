name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build and sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/salahos.jks"
            export KS_FILE="$RUNNER_TEMP/salahos.jks" KS_PASS="$KEYSTORE_PASS"
            echo "Signing with the permanent key"
          else
            echo "No permanent key set; using the debug key"
          fi
          gradle assembleDebug --no-daemon --stacktrace -PvCode=$((100 + GITHUB_RUN_NUMBER)) -PvName=1.0.$GITHUB_RUN_NUMBER
      - uses: actions/upload-artifact@v4
        with:
          name: salah-os-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to the apk branch
        # Only from main. Every frame updates itself from this branch, so a build made from a
        # work branch to test on one frame must never become everyone's update.
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/salah-os.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk
          git rm -rf . -q
          cp /tmp/out/salah-os.apk .
          printf '{"versionCode":%s,"versionName":"1.0.%s","sha256":"%s"}\n' $((100 + GITHUB_RUN_NUMBER)) $GITHUB_RUN_NUMBER $(sha256sum salah-os.apk | cut -d' ' -f1) > version.json
          git add salah-os.apk version.json
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f origin apk
