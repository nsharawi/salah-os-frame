plugins { id 'com.android.application' }

android {
    namespace 'com.paltech.salahos'
    compileSdk 34
    defaultConfig {
        applicationId 'com.paltech.salahos'
        minSdk 26
        targetSdk 34
        versionCode (project.findProperty('vCode') ?: '2') as int
        versionName (project.findProperty('vName') ?: '1.0.1')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Permanent signing key. CI supplies it from GitHub secrets; without it the normal debug key is used.
    signingConfigs {
        salahos {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias 'salahos'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('KS_FILE')) signingConfig signingConfigs.salahos
        }
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'dev.mobile:dadb:1.2.10'
}
