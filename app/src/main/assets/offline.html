<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salah OS</title>
<!--
  Everything the frame shows before it has any internet: choose a language, then either keep
  trying the network it already knows, or raise a hotspot so a phone can hand one over.

  It is built to the same shape as the setup wizard that follows it — a quiet left panel carrying
  the logo and the question, the answer on the right, one pill button in the corner — so that the
  first screens of a new frame and the wizard read as one continuous thing rather than two
  different programs. Cairo cannot be loaded here, since there is no network yet by definition,
  so this falls back to the system typeface; everything else is matched.

  Language comes first, before anything else is read, and is the only screen in both languages.
-->
<style>
:root{
  --bg:#F6F7F8; --on:#17191C; --dim:#454C54; --row:#EEF0F2; --line:#C3C7CC;
  --p:#2E649E; --on-p:#FFFFFF;
  --ok:#0B5133; --ok-bg:#B7F0C8;
  --em:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--on);
  font:400 16px/24px system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}

/* The setup wizard's own frame: a quiet left panel carrying the logo and the question, the answer
   on the right, one pill button in the corner. The same shape the wizard that follows uses, so a
   new frame's first screens and its setup read as one program rather than two. */
.wz{position:absolute;inset:0;display:none;grid-template-columns:minmax(0,5fr) minmax(0,6fr);
    grid-template-rows:minmax(0,1fr) auto}
.wz.on{display:grid}
.wzl{padding-block:24px 0;padding-inline:48px 24px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.lg{height:140px;width:auto;align-self:flex-start;margin:0 0 40px}
h1{margin:0 0 16px;font-size:45px;line-height:52px;font-weight:400;letter-spacing:0}
/* Body Large is right for a phone in the hand and far too small on a panel read from across a
   room. These screens take the step below the heading instead - Headline Small under Display
   Medium - so a line of explanation is legible from where the frame is actually looked at. */
.p{margin:0;font-size:24px;line-height:32px;color:var(--dim);max-width:560px}
.p b{font-weight:600;color:var(--on)}
.wzr{display:flex;align-items:center;padding-block:24px 0;padding-inline:12px 48px;min-width:0}
.wzi{width:100%}

.wzf{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:16px;padding-block:16px 40px;padding-inline:48px}

/* a group of choices, Android Settings style: outer corners 28, inner 4, a 2 px gap */
.grp{display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;gap:20px;width:100%;min-height:90px;padding-block:12px;padding-inline:16px 20px;
    border:0;background:var(--row);color:inherit;font:inherit;text-align:start;cursor:pointer;
    border-radius:4px;position:relative;overflow:hidden}
.grp .it:first-child{border-radius:28px 28px 4px 4px}
.grp .it:last-child{border-radius:4px 4px 28px 28px}
.grp .it:only-child{border-radius:28px}
.it:active{filter:brightness(.97)}
.rad{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center}
.it.on .rad{border-color:var(--p)}
.it.on .rad:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--p)}
.hl{font-size:16px;line-height:24px}

/*
  Sizes here are Material 3 type-scale steps, not numbers that looked right: Display Medium
  45/52 for the heading, Headline Small 24/32 for the frame's name, Title Large 22/28 under the
  code, Body Large 16/24 for prose and Body Medium 14/20 for the quiet lines. M3's tracking
  figures are drawn for Roboto, so they are left off rather than borrowed onto Cairo.
*/
/* the one pill button */
.btn{height:60px;min-width:175px;padding:0 32px;border:0;border-radius:30px;background:var(--p);
     color:var(--on-p);font:500 14px/20px inherit;font-family:inherit;cursor:pointer;
     transition:transform .12s var(--em)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--p);min-width:0;padding:0 20px}

/* the hotspot code, and the quieter bits */
/* The code and nothing else. A card behind it only read as a pale box around a white box. */
/* The code sits on the page, not in a box on the page: no card, no border, nothing behind it.
   The writer draws it white-backed and black-inked; both are overridden here, because a
   presentation attribute in the markup loses to a stylesheet. The quiet zone it builds in stays -
   that one is not decoration, a scanner needs it. */
.qr{width:300px;height:300px}
.qr svg{width:100%;height:100%;display:block}
.qr svg rect{fill:none}
.qr svg path{fill:var(--on)}
.qcap{font-size:22px;line-height:28px;color:var(--dim);text-align:center}
/* The code is read off this screen from wherever the buyer is standing and typed into a phone
   one figure at a time, so it is drawn one figure at a time: a cell each, grouped three and
   three, which is how a person reads a number back to themselves. Always left to right - a
   sequence of figures to copy is not text and does not mirror. */
.code{display:flex;gap:10px;direction:ltr;align-items:center}
.code .cell{width:64px;height:84px;border-radius:16px;background:var(--row);
  display:flex;align-items:center;justify-content:center;
  font-size:45px;line-height:52px;font-weight:500;color:var(--on);
  font-variant-numeric:tabular-nums}
.code .sp{width:14px}
.codecap{font-size:22px;line-height:28px;color:var(--dim);text-align:center;margin-top:-10px}
.name{margin:0;font-size:24px;line-height:32px;font-weight:400;color:var(--p);letter-spacing:0;unicode-bidi:plaintext}
/* Material's indeterminate circular indicator: the ring turns while the arc inside it grows and
   shrinks. The circle is 125.6 units around, which is where the dash lengths come from. The arc
   never shrinks below a sixth of the ring - any thinner and from across a room it reads as a
   stray dot rather than something in motion. */
/* the same 300px square the code occupies, so the screen does not jump when one replaces
   the other and the ring is legible from the same distance */
.tick{width:300px;height:300px}
.tick circle{fill:var(--ok-bg);stroke:none}
.tick path{fill:none;stroke:var(--ok);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:26;stroke-dashoffset:26;animation:draw .45s var(--em) .05s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spin{width:300px;height:300px;animation:turn 1.6s linear infinite}
.spin circle{fill:none;stroke:var(--p);stroke-width:3;stroke-linecap:round;
             animation:arc 1.4s ease-in-out infinite;transform-origin:center}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes arc{
  0%{stroke-dasharray:22 104;stroke-dashoffset:0}
 50%{stroke-dasharray:88 38;stroke-dashoffset:-18}
100%{stroke-dasharray:22 104;stroke-dashoffset:-124}}
@media (prefers-reduced-motion:reduce){
  .spin{animation:none}
  .spin circle{animation:none;stroke-dasharray:88 38}
  .tick path{animation:none;stroke-dashoffset:0}}
.s{display:flex;align-items:center;gap:12px;font-size:14px;line-height:20px;color:var(--dim)}
.why{margin:16px 0 0;font-size:14px;line-height:20px;color:#8C1D18}
@media (prefers-reduced-motion:reduce){.d{animation:none}*{transition:none !important}}
@media (max-width:900px),(max-height:560px){
  .wz.on{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;text-align:center}
  .wzl{padding-block:28px 0;padding-inline:24px;justify-content:flex-end}
  .lg{align-self:center;height:92px;margin-bottom:20px}
  h1{font-size:32px;line-height:40px}
  .p{margin-inline:auto}
  .wzr{padding-block:20px 0;padding-inline:24px;justify-content:center}
  .wzf{justify-content:center;padding-block:16px 28px;padding-inline:24px}
  .qr{width:230px;height:230px}
}
}

</style></head><body>

    'That did not work. Try again on your phone.': 'لم ينجح. حاول مرة أخرى من هاتفك.',
    'Phone setup is not available on this frame.': 'الإعداد من الهاتف غير متاح على هذا الإطار.'
  };
  var F = window.SalahFrame, lang = '', chosen = 'en', shown = '', shownCode = '';
  function t(s) { return lang === 'ar' && AR[s] ? AR[s] : s; }
  function id(x) { return document.getElementById(x); }
  function screen(which) {
    ['pick', 'wait', 'hot'].forEach(function (s) { id(s).className = 'wz' + (s === which ? ' on' : ''); });
  }

  /* A language chosen once is never asked for again, here or on the phone or in the wizard. */
  try { if (F && F.getLang) lang = F.getLang() || ''; } catch (e) { }

  function mark(v) {
    chosen = v;
    ['en', 'ar'].forEach(function (x) {
      var b = id(x), on = x === v;
      b.className = 'it' + (on ? ' on' : '');
      b.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }
  id('en').onclick = function () { mark('en'); };
  id('ar').onclick = function () { mark('ar'); };
  id('go').onclick = function () {
    lang = chosen;
    try { if (F && F.setLang) F.setLang(lang); } catch (e) { }
    begin();
  };
  if (lang) { mark(lang); begin(); } else {
    screen('pick');
    /* The slowest part of all this is the frame looking at what networks are in range, which it
       cannot do while it is broadcasting. Started here it happens while the buyer reads this
       screen, and the code appears almost as soon as they press the button. */
    try { if (F && F.netWarm) F.netWarm(); } catch (e) { }
  }

  function begin() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    /* Until the frame knows which of the two it is, it says only that it is working. */
    id('wh').textContent = t('Just a moment');
    id('wp').textContent = t('Getting this frame ready.');
    id('hh').textContent = t('Set up from your phone');
    var b = id('wifi');
    if (F && F.openWifi) { b.textContent = t('Wi-Fi settings'); b.onclick = function () { F.openWifi(); }; }
    b.hidden = true;   /* only offered once the frame knows it is stuck, not while it is starting */
    screen('wait');
    if (!F || !F.netBegin) return;   /* an older frame: the plain page is all there is */
    F.netBegin();
    setInterval(tick, 1000);
  }

  /* Nothing is said about looking for networks: the frame cannot look while it is broadcasting,
     and a line in the corner saying it is doing something it is not helps nobody. */
  var LIVE = { failed: 'That did not work. Try again on your phone.' };

  /*
     Whatever is happening on the phone shows on the frame, full size.
     Someone who taps Join on their phone looks up at the frame, and a line of small print in the
     corner saying the same thing is not an answer: the frame should visibly be doing it. So the
     waiting screen is borrowed back - the network being joined under a turning ring, and then a
     check when it is done, which is what the phone shows at that moment too.
  */
  function esc(x) {
    return String(x).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* The figures, alone on the screen, at the moment they are wanted. */
  function showCode(value) {
    if (shownCode !== value) {
      var cells = '';
      for (var i = 0; i < value.length; i++) {
        if (i === 3) cells += '<span class="sp"></span>';
        cells += '<span class="cell">' + value.charAt(i) + '</span>';
      }
      id('code').innerHTML = cells;
      shownCode = value;
    }
    id('hh').textContent = t('Enter this code');
    id('codecap').textContent = t('On your phone, to finish setting up');
    id('ssid').hidden = true; id('q1').hidden = true; id('qcap').hidden = true;
    id('code').hidden = false; id('codecap').hidden = false;
    screen('hot');
  }

  function stage(head, sub, done, strong) {
    id('wh').textContent = t(head);
    /* The network's name is the subject of the sentence, and a Latin name on an Arabic frame
       keeps its own direction without dragging the line it sits in around with it. */
    if (strong) id('wp').innerHTML = '<b style="unicode-bidi:isolate">' + esc(sub) + '</b>';
    else id('wp').textContent = sub;
    id('spin').style.display = done ? 'none' : '';
    id('tick').style.display = done ? '' : 'none';
    id('why').hidden = true;
    id('wifi').hidden = true;
    screen('wait');
  }

  function tick() {
    var d;
    try { d = JSON.parse(F.netInfo()); } catch (e) { return; }
    /*
       The right-hand side shows one thing at a time, in the order the buyer does them.

       The code used to sit under the square from the moment the screen appeared, which asks
       somebody to remember six figures before they have done the thing that needs them. It now
       waits: the square until a phone takes an address, a turning ring while that phone finds its
       way to the page, and the figures once it is there - the moment they are about to be typed.
    */
    var busyJoining = d.state === 'joining' || d.state === 'connected';
    if (d.phase === 'ready' && d.code && d.asked && !busyJoining) { showCode(d.code); return; }
    if (d.phase === 'ready' && d.client && !d.asked && !busyJoining) {
      stage('Phone connected', t('Opening setup on your phone…'), false);
      return;
    }

    if (d.state === 'joining') { stage('Connecting to', d.joining || '', false, true); return; }
    if (d.state === 'connected') { stage('Connected', t('Salah OS is starting.'), true); return; }

    if (d.phase === 'ready' && d.ssid) {
      id('ssid').hidden = false; id('q1').hidden = false; id('qcap').hidden = false;
      id('code').hidden = true; id('codecap').hidden = true;
      if (shown !== d.ssid + d.url) {
        shown = d.ssid + d.url;
        /* One code and nothing else. Joining the frame is all the phone needs to be told; once it
           has, the frame answers the check every phone makes for a way out and the setup page
           opens by itself, the way hotel Wi-Fi does. Nobody is told any of that: a code under a
           heading is a thing people already know how to use. */
        /* An open access point is written differently: a phone handed T:WPA with no passphrase
           joins and then sits there failing to authenticate. */
        var join = d.open ? 'WIFI:T:nopass;S:' + d.ssid + ';;'
                          : 'WIFI:T:WPA;S:' + d.ssid + ';P:' + d.pass + ';;';
        try { id('q1').innerHTML = window.SalahQR.svg(join); } catch (e) { }
        id('ssid').textContent = d.ssid;
        id('qcap').textContent = t('Scan to connect Wi-Fi');
      }
      var live = id('live');
      live.innerHTML = '';
      if (LIVE[d.state]) {
        live.appendChild(document.createElement('span')).className = 'd';
        live.appendChild(document.createTextNode(' ' + t(LIVE[d.state])));
      }
      screen('hot');
      return;
    }
    screen('wait');
    var why = id('why');
    if (d.phase === 'error') {
      why.hidden = false;
      why.textContent = t('Phone setup is not available on this frame.') + ' ' + (d.why || '');
      id('wh').textContent = t('Connect to Wi-Fi');
      id('wp').textContent = t('Salah OS needs the internet to load prayer times. It starts by itself once this frame is online.');
      id('wifi').hidden = !(F && F.openWifi);
    } else if (d.phase === 'retry') {
      /* this frame knows a network and simply cannot reach it */
      why.hidden = true;
      id('wh').textContent = t('Connect to Wi-Fi');
      id('wp').textContent = t('Salah OS needs the internet to load prayer times. It starts by itself once this frame is online.');
      id('wifi').hidden = !(F && F.openWifi);
    } else {
      why.hidden = true;
      id('wifi').hidden = true;
      id('wh').textContent = t('Just a moment');
      id('wp').textContent = t('Getting this frame ready.');
    }
    id('spin').style.display = '';
    id('tick').style.display = 'none';
  }
})();
</script></body></html>
