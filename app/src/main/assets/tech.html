<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technician mode</title>
<style>
:root{--bg:#0E1411;--surface:#171D1A;--hi:#222A26;--ink:#E4EAE6;--mute:#9AA69F;--line:#2C3530;--pri:#8FD6B8;--onpri:#003826;--err:#FFB4AB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Roboto,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
#pin,#grid{position:absolute;inset:0;display:flex}
[hidden]{display:none!important}
/* PIN pad */
#pin{align-items:center;justify-content:center;gap:72px;padding:24px}
.pl{display:flex;flex-direction:column;align-items:center;text-align:center;width:340px}
.pl img{height:84px;margin-bottom:22px}
.pl h1{font-size:28px;font-weight:500;margin:0 0 8px}
.pl p{margin:0;color:var(--mute);font-size:17px;line-height:1.45;min-height:50px}
.pl p.e{color:var(--err)}
.dots{display:flex;gap:16px;margin:26px 0 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute);transition:background .12s,border-color .12s,transform .12s}
.dots i.on{background:var(--pri);border-color:var(--pri);transform:scale(1.1)}
.dots.shake{animation:sh .32s}
@keyframes sh{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,92px);gap:14px}
.pad button{height:76px;border-radius:38px;background:var(--hi);font-size:30px;font-weight:500;transition:background .1s,transform .1s}
.pad button:active{background:var(--pri);color:var(--onpri);transform:scale(.96)}
.pad button.t{background:none;font-size:17px;color:var(--mute)}
.pad button:disabled{opacity:.35}
/* App grid */
#grid{flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line)}
.top img{height:38px}
.top .ti{flex:1;min-width:0}
.top h1{font-size:21px;font-weight:600;margin:0}
.top .sub{color:var(--mute);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-height:48px;padding:0 22px;border-radius:24px;font-size:16px;font-weight:600;border:1px solid var(--line)}
.btn.pri{background:var(--pri);color:var(--onpri);border-color:transparent}
.btn:active{opacity:.75}
.note{margin:14px 28px 0;padding:12px 16px;border-radius:12px;background:var(--hi);color:var(--mute);font-size:15px;line-height:1.4}
.apps{flex:1;overflow:auto;padding:22px 28px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px;border-radius:16px;font-size:15px;text-align:center;line-height:1.25;transition:background .1s}
.app:active{background:var(--hi)}
.app img,.app .ph{width:60px;height:60px;border-radius:14px}
.app .ph{background:var(--hi);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:var(--pri)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
